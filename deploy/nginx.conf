# Auslieferung des fertigen Flutter-Web-Builds.
#
# Der Container baut nichts – er reicht nur aus, was der GitHub-Runner
# gebaut und deploy.sh nach releases/<stand>/ entpackt hat. "www" ist ein
# RELATIVER Symlink darauf; nginx folgt ihm bei jedem Request neu, deshalb
# ist ein Deploy im selben Moment live, in dem der Symlink schwenkt.

# Cache-Regeln als map, nicht als add_header je location: ein add_header in
# einer location ersetzt ALLE geerbten Kopfzeilen der server-Ebene. Über die
# map bleibt es bei genau einer Stelle pro Kopfzeile, und die Sicherheits-
# kopfzeilen unten können nicht versehentlich verlorengehen.
map $uri $fs_cache {
    # Wie Vercel es bisher ausgeliefert hat: immer nachfragen, aber per ETag
    # mit einer 304 ohne Rumpf beantworten. Flutter hängt an seine Dateien
    # keine Prüfsummen (main.dart.js heißt immer main.dart.js) – ein langes
    # max-age würde ein Update bei Sarah schlicht nie ankommen lassen.
    default                        "public, max-age=0, must-revalidate";

    # Die Startkette gar nicht erst ablegen. Ein zwischengespeicherter
    # Service Worker ist der klassische Grund, warum ein Deploy auf einem
    # iPhone tagelang unsichtbar bleibt.
    ~^/$                           "no-store";
    ~^/index\.html$                "no-store";
    ~^/flutter_bootstrap\.js$      "no-store";
    ~^/flutter_service_worker\.js$ "no-store";
    ~^/version\.json$              "no-store";
}

server {
    listen 80;
    server_name _;

    root  /srv/www;
    index index.html;

    # Vercels CDN hat vorher unsichtbar komprimiert. Das ist hier kein
    # Feinschliff, sondern tragend: main.dart.js wiegt 2,8 MB, canvaskit.wasm
    # 6,9 MB, dazu skwasm* mit 3,5–5 MB – und Sarah lädt das über Mobilfunk.
    gzip              on;
    gzip_static       on;   # nimmt die .gz aus dem CI: beste Rate, keine CPU hier
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/wasm image/svg+xml font/ttf font/woff2;

    add_header Cache-Control            $fs_cache        always;
    add_header X-Content-Type-Options   nosniff          always;
    add_header Referrer-Policy          strict-origin-when-cross-origin always;

    # Die App kennt keine URL-Routen (kein GoRouter, kein onGenerateRoute),
    # der Rückfall auf index.html fängt nur veraltete Service-Worker-Pfade ab.
    #
    # Das abschließende =404 ist wichtig: ohne es behandelt nginx den letzten
    # Eintrag als interne Weiterleitung, und solange noch kein Release
    # ausgeliefert wurde, dreht sich das im Kreis und endet in einem 500
    # statt in einem ehrlichen 404.
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Nichts Verstecktes ausliefern, falls je etwas danebenfällt.
    location ~ /\. {
        deny all;
    }

    access_log off;
}
